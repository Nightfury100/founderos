name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: "postgresql://founderos:founderos@localhost:5432/founderos?schema=public"
  REDIS_URL: "redis://localhost:6379"
  NEXTAUTH_URL: "http://localhost:3000"
  NEXTAUTH_SECRET: "ci-only-secret-not-for-production-use"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: founderos
          POSTGRES_PASSWORD: founderos
          POSTGRES_DB: founderos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U founderos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # No `version:` input — pnpm/action-setup@v4 errors out when it is set
      # alongside `packageManager` in package.json. package.json (pnpm@9.15.0)
      # is the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @founderos/db exec prisma validate

      - name: Prisma migrate deploy
        run: pnpm --filter @founderos/db exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @founderos/db exec prisma db seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
